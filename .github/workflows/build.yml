name: Build executables

# Builds a stand-alone program (no Python needed) for Windows, macOS and Linux.
# Every push uploads the files as workflow artifacts. A release (with the files
# attached) is made either by pushing a tag like v1.0.0, or by running this
# workflow by hand (Actions -> Build executables -> Run workflow) with a version;
# the manual run creates the tag on the chosen commit.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MusTra-windows.exe
          - os: macos-latest
            asset: MusTra-macos.zip
          - os: ubuntu-latest
            asset: MusTra-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller pytest

      - name: Run tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --onefile --windowed --name MusTra run_gui.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MusTra.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MusTra.app ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/MusTra ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

      - name: Attach to release (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: MusTra ${{ inputs.version }}
          files: ${{ matrix.asset }}
